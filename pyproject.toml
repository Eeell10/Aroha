[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aroha-engineering"
version = "0.1.0"
description = "Traceable conceptual analyses for a three-motor VTOL UAV"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "matplotlib==3.9.4", "pandas==2.2.3", "ADRpy==0.2.6"]

[project.scripts]
aroha-analyse = "aroha.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
